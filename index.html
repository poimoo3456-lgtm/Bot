<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NattDev QR Pro+</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#0f2027;
  color:white;
  text-align:center;
}

.container { max-width:420px; margin:auto; padding:10px; }

.box {
  background:rgba(255,255,255,0.1);
  padding:15px;
  border-radius:15px;
  margin-top:10px;
}

input, button {
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:10px;
}

button { background:#00ffcc; }

.templates {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.templates img {
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

.templates img.active {
  outline:2px solid #00ffcc;
}

canvas {
  width:100%;
  margin-top:10px;
  border-radius:10px;
  background:white;
}
</style>
</head>

<body>

<div class="container">

<h2>🔥 QR Studio Pro+</h2>

<!-- เลือกโหมด -->
<div class="box">
<button onclick="mode='template'">🎨 ใช้แม่แบบ</button>
<button onclick="mode='upload'">🖼️ ใช้รูปของฉัน</button>
</div>

<!-- TEMPLATE -->
<div class="box" id="templateBox">
<h3>เลือกแม่แบบ</h3>

<div class="templates">
<img src="https://picsum.photos/200?1" onclick="selectTemplate(this)">
<img src="https://picsum.photos/200?2" onclick="selectTemplate(this)">
<img src="https://picsum.photos/200?3" onclick="selectTemplate(this)">
<img src="https://picsum.photos/200?4" onclick="selectTemplate(this)">
<img src="https://picsum.photos/200?5" onclick="selectTemplate(this)">
<img src="https://picsum.photos/200?6" onclick="selectTemplate(this)">
</div>
</div>

<!-- UPLOAD -->
<div class="box">
<input type="file" id="upload" accept="image/*">
</div>

<!-- INPUT -->
<div class="box">
<input id="text" placeholder="ข้อความ / ลิงก์">
<button onclick="generate()">สร้าง QR</button>
<button onclick="download()">ดาวน์โหลด</button>

<canvas id="canvas"></canvas>
</div>

</div>

<script>
let mode = "template";
let selectedImage = null;
let userImage = null;

// เลือก template
function selectTemplate(img){
  document.querySelectorAll(".templates img").forEach(i=>i.classList.remove("active"));
  img.classList.add("active");

  selectedImage = new Image();
  selectedImage.crossOrigin="anonymous";
  selectedImage.src = img.src;
}

// upload รูป
upload.onchange = e=>{
  const file = e.target.files[0];
  const reader = new FileReader();

  reader.onload = ()=>{
    userImage = new Image();
    userImage.src = reader.result;
  }

  reader.readAsDataURL(file);
}

// สร้าง QR
function generate(){
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = 400;
  canvas.height = 400;

  let img = null;

  if(mode==="upload" && userImage){
    img = userImage;
  }

  if(mode==="template" && selectedImage){
    img = selectedImage;
  }

  if(img){
    img.onload = ()=>{
      ctx.drawImage(img,0,0,400,400);
      drawQR(ctx);
    }
    if(img.complete){
      ctx.drawImage(img,0,0,400,400);
      drawQR(ctx);
    }
  } else {
    drawQR(ctx);
  }
}

// วาด QR
function drawQR(ctx){
  const data = text.value;

  QRCode.toCanvas(document.createElement("canvas"), data, {
    width:250,
    margin:1
  }, function(err, qrCanvas){

    // blend (เนียน)
    ctx.globalAlpha = 0.85;
    ctx.drawImage(qrCanvas,75,75,250,250);
    ctx.globalAlpha = 1;

  });
}

// ดาวน์โหลด
function download(){
  const link=document.createElement("a");
  link.download="qr.png";
  link.href=canvas.toDataURL();
  link.click();
}
</script>

</body>
</html>
