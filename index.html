<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>NattDev QR Ultimate</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body {
  font-family: sans-serif;
  background: linear-gradient(135deg,#0f2027,#2c5364);
  color: white;
  text-align: center;
}
.box {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  margin: 20px auto;
  width: 300px;
  border-radius: 15px;
}
input, button {
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  border: none;
}
button {
  background: #00ffcc;
  cursor: pointer;
}
canvas {
  margin-top: 20px;
  border: 5px solid white;
  border-radius: 10px;
}
.hidden { display: none; }
</style>
</head>

<body>

<h1>🔥 NattDev QR Ultimate</h1>

<!-- LOGIN -->
<div id="auth" class="box">
  <h3>สมัคร / ล็อกอิน</h3>
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>

  <button onclick="register()">สมัคร</button>
  <button onclick="login()">ล็อกอิน</button>
</div>

<!-- DASHBOARD -->
<div id="app" class="hidden">
  <div class="box">
    <h3 id="welcome"></h3>

    <input id="text" placeholder="ใส่ข้อความ / ลิงก์"><br>

    <label>สี QR</label>
    <input type="color" id="color" value="#00ffcc"><br>

    <button onclick="generateQR()">สร้าง QR</button>
    <button onclick="downloadQR()">ดาวน์โหลด</button>

    <br>
    <canvas id="qr"></canvas>
  </div>
</div>

<script>
let currentUser = null;

// สมัคร
function register() {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if (!email || !pass) return alert("กรอกข้อมูล");

  localStorage.setItem("user_"+email, pass);
  alert("สมัครสำเร็จ");
}

// ล็อกอิน
function login() {
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  const saved = localStorage.getItem("user_"+email);

  if (saved === pass) {
    currentUser = email;
    localStorage.setItem("login", email);

    showApp();
  } else {
    alert("ข้อมูลไม่ถูกต้อง");
  }
}

// โหลด session
window.onload = () => {
  const loginUser = localStorage.getItem("login");
  if (loginUser) {
    currentUser = loginUser;
    showApp();
  }
};

// แสดง dashboard
function showApp() {
  document.getElementById("auth").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  document.getElementById("welcome").innerText =
    "👤 ผู้ใช้: " + currentUser;
}

// สร้าง QR
function generateQR() {
  const text = document.getElementById("text").value;
  const color = document.getElementById("color").value;

  const data = JSON.stringify({
    name: currentUser,
    text: text,
    time: new Date().toLocaleString()
  });

  QRCode.toCanvas(document.getElementById("qr"), data, {
    color: {
      dark: color,
      light: "#000000"
    }
  });
}

// ดาวน์โหลด
function downloadQR() {
  const canvas = document.getElementById("qr");
  const link = document.createElement("a");
  link.download = "qr.png";
  link.href = canvas.toDataURL();
  link.click();
}
</script>

</body>
</html>
