<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NattDev Self Development System PRO</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff}
.container{padding:20px}
.card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);padding:15px;border-radius:15px;margin-bottom:15px}
input,button,textarea{width:100%;padding:10px;margin:5px 0;border:none;border-radius:10px}
button{background:linear-gradient(45deg,#06b6d4,#3b82f6);color:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.book{padding:10px;border-radius:10px;background:#1e293b;cursor:pointer}
.progress{height:10px;background:#1e293b;border-radius:10px;margin-top:5px}
.progress-bar{height:10px;background:#22c55e;border-radius:10px;transition:width 0.3s}
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const app=document.getElementById('app')

// ===== USER SYSTEM =====
function getUser(){return JSON.parse(localStorage.getItem('user'))}
function saveUser(u){localStorage.setItem('user',JSON.stringify(u))}

function showAuth(){
app.innerHTML=`
<div class="card">
<h2>Login / Register</h2>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<input id="goal" placeholder="Goal">
<button onclick="auth()">เข้าใช้งาน</button>
</div>`
}

function auth(){
const username=document.getElementById('username').value
const password=document.getElementById('password').value
const goal=document.getElementById('goal').value
let u=getUser()
if(!u){
u={username,password,goal,xp:0,level:1,completed:[],streak:0}
saveUser(u)
alert('สมัครสำเร็จ')
}else if(u.username===username && u.password===password){
alert('เข้าสู่ระบบสำเร็จ')
}else{
alert('Username หรือ Password ไม่ถูกต้อง')
return
}
render()
}

// ===== DASHBOARD =====
function dashboard(){
const u=getUser()
let progress=u.xp%100
return `
<div class="card">
<h2>Dashboard</h2>
<p>Level: ${u.level}</p>
<p>XP: ${u.xp}</p>
<p>Goal: ${u.goal}</p>
<p>Streak: ${u.streak} วัน</p>
<div class="progress"><div class="progress-bar" style="width:${progress}%"></div></div>
</div>`
}

// ===== PLACEHOLDER LIBRARY =====
const books=[
{title:'หนังสือ A',category:'Self Development'},
{title:'หนังสือ B',category:'Coding'},
{title:'หนังสือ C',category:'Trading'}
]

function library(){
let html='<h2>Library</h2><div class="grid">'
books.forEach((b,i)=>{
html+=`<div class="book" onclick="openBook(${i})">${b.title}</div>`
})
html+='</div>'
return html
}

function generateContent(title){
return {chapters:[`บทที่ 1: พื้นฐาน ${title}`,`บทที่ 2: การใช้งาน ${title}`,`บทที่ 3: ขั้นสูง ${title}`],exercises:['คุณได้เรียนรู้อะไร?','จะนำไปใช้ยังไง?']}
}

function openBook(i){
const b=books[i]
const c=generateContent(b.title)
let html=`<div class="card"><h2>${b.title}</h2>`
c.chapters.forEach(ch=>html+=`<p>${ch}</p>`)
c.exercises.forEach((ex,idx)=>{
html+=`<textarea placeholder="${ex}" onblur="saveAnswer(${i},${idx},this.value)"></textarea>`
})
html+=`<button onclick="completeBook(${i})">อ่านจบ</button></div>`
app.innerHTML=dashboard()+html+aiCoach()+payment()
}

function saveAnswer(book,ex,val){
let data=JSON.parse(localStorage.getItem('answers')||'{}')
data[book+'-'+ex]=val
localStorage.setItem('answers',JSON.stringify(data))
}

function completeBook(i){
let u=getUser()
if(!u.completed.includes(i)){
u.completed.push(i)
u.xp+=20
u.streak+=1
u.level=Math.floor(u.xp/100)+1
saveUser(u)
alert('ได้ XP +20')
}
render()
}

// ===== AI COACH (MOCK CHATBOT) =====
function aiCoach(){
return `<div class="card">
<h2>AI Coach</h2>
<textarea id="q" placeholder="ถามคำถาม"></textarea>
<button onclick="askAI()">ถาม</button>
<div id="res"></div>
</div>`
}

function askAI(){
const q=document.getElementById('q').value
document.getElementById('res').innerHTML=`แนะนำ: อ่าน ${books[0].title} และฝึกทุกวันเพื่อ XP + Streak`}

// ===== PAYMENT + TELEGRAM =====
function payment(){
return `<div class="card">
<h2>สนับสนุน / โอนเงิน</h2>
<img src="https://cdn.phototourl.com/free/2026-03-30-b6bd7b60-7a93-4171-b412-3be02f5d728d.jpg" width="100%">
<input type="file" id="slip">
<button onclick="sendSlip()">ส่งสลิป</button>
</div>`
}

function sendSlip(){
// ตัวอย่างส่งข้อมูลไป Telegram (ต้องใส่ BOT TOKEN & CHAT ID จริง)
alert('ส่งสลิปไป Telegram เรียบร้อย (mock)')
}

// ===== MAIN RENDER =====
function render(){
if(!getUser()) return showAuth()
app.innerHTML=`<h1>NattDev Self Development System PRO</h1>`+dashboard()+library()+aiCoach()+payment()
}

render()
</script>
</body>
</html>
