<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NattDev QR Shop</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body {
  margin:0;
  font-family: system-ui;
  background: #0f172a;
  color:white;
}

.container {
  max-width: 900px;
  margin:auto;
  padding:15px;
}

h1 { text-align:center; }

.card {
  background:#1e293b;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
}

input, textarea {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:none;
}

button {
  margin-top:10px;
  padding:12px;
  width:100%;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-weight:bold;
}

.product {
  background:#334155;
  padding:10px;
  border-radius:12px;
  margin-top:10px;
}

.product img {
  width:100%;
  border-radius:10px;
}

.qr {
  display:flex;
  justify-content:center;
  margin-top:10px;
}

.copy {
  background:#0ea5e9;
}

</style>
</head>

<body>

<div class="container">

<h1>🛒 NattDev QR Shop</h1>

<!-- ADMIN -->
<div class="card">
<h2>🔧 หลังบ้าน</h2>

<input id="name" placeholder="ชื่อสินค้า">
<input id="price" placeholder="ราคา">
<input id="img" placeholder="ลิงก์รูปภาพ">
<textarea id="desc" placeholder="รายละเอียด"></textarea>

<button onclick="addProduct()">➕ เพิ่มสินค้า</button>

<div id="adminList"></div>
</div>

<!-- QR -->
<div class="card">
<h2>📱 QR ร้าน</h2>
<div class="qr"><canvas id="qr"></canvas></div>
</div>

<!-- SHOP -->
<div class="card">
<h2>🛍️ สั่งซื้อ</h2>

<input id="cname" placeholder="ชื่อ *">
<input id="phone" placeholder="เบอร์ *">
<input id="contact" placeholder="Facebook / Line">

<h3>สินค้า</h3>
<div id="shopList"></div>

<button onclick="order()">✅ ยืนยันสั่งซื้อ</button>

<div id="result"></div>
</div>

</div>

<script>

// ===== โหลดสินค้า =====
let products = JSON.parse(localStorage.getItem("products")) || [];

// ===== เพิ่มสินค้า =====
function addProduct(){
  if(!name.value || !price.value){
    alert("กรอกชื่อและราคา");
    return;
  }

  let p = {
    name:name.value,
    price:price.value,
    img:img.value || "https://via.placeholder.com/300",
    desc:desc.value
  };

  products.push(p);
  localStorage.setItem("products", JSON.stringify(products));

  name.value = price.value = img.value = desc.value = "";
  render();
}

// ===== แสดงสินค้า =====
function render(){
  adminList.innerHTML = "";
  shopList.innerHTML = "";

  products.forEach((p,i)=>{
    adminList.innerHTML += `
      <div class="product">
        <b>${p.name}</b> - ${p.price}฿
      </div>
    `;

    shopList.innerHTML += `
      <div class="product">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <p>💰 ${p.price} บาท</p>
        <label>
          <input type="checkbox" value="${p.name}|${p.price}">
          เลือกสินค้า
        </label>
      </div>
    `;
  });
}

// ===== QR =====
QRCode.toCanvas(document.getElementById("qr"), window.location.href, {
  width:200
});

// ===== Telegram =====
const TOKEN = "8583371666:AAFgVt_SVUw8Gr5DJCzIG474MqmbJ6HBtjg";
const CHAT_ID = "7967010433";

// ===== สั่งซื้อ =====
function order(){

  let cnameVal = cname.value.trim();
  let phoneVal = phone.value.trim();

  if(!cnameVal || !phoneVal){
    alert("กรอกชื่อและเบอร์");
    return;
  }

  let selected = [];
  let total = 0;

  document.querySelectorAll("#shopList input:checked").forEach(el=>{
    let [n,p] = el.value.split("|");
    selected.push(n);
    total += parseInt(p);
  });

  if(selected.length === 0){
    alert("เลือกสินค้า");
    return;
  }

  let msg = `
🛒 ออเดอร์ใหม่
👤 ${cnameVal}
📞 ${phoneVal}
💬 ${contact.value}

📦 ${selected.join(", ")}
💰 รวม ${total} บาท
`;

  // ===== ส่ง Telegram =====
  fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      chat_id:CHAT_ID,
      text:msg
    })
  });

  // ===== ลิงก์ =====
  let url = window.location.href;

  result.innerHTML = `
    <p>📎 คัดลอกลิงก์ร้าน</p>
    <input id="copyLink" value="${url}">
    <button class="copy" onclick="copyLink()">📋 คัดลอก</button>
  `;

  alert("สั่งซื้อเรียบร้อย");
}

// ===== copy =====
function copyLink(){
  let input = document.getElementById("copyLink");
  input.select();
  document.execCommand("copy");
  alert("คัดลอกแล้ว");
}

// ===== start =====
render();

</script>

</body>
</html>
