<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NattDev QR Shop</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white;}
.container{max-width:900px;margin:auto;padding:15px;}
.card{background:#1e293b;padding:15px;border-radius:15px;margin-top:15px;}
input,textarea,button{width:100%;padding:10px;margin-top:10px;border-radius:10px;border:none;}
button{background:#22c55e;color:white;font-weight:bold;}
.product{background:#334155;padding:10px;border-radius:10px;margin-top:10px;}
img{width:100%;border-radius:10px;}
.nav button{width:32%;background:#0ea5e9;}
.hidden{display:none;}
.contact-btn{display:block;text-align:center;padding:12px;margin-top:10px;border-radius:10px;color:white;text-decoration:none;font-weight:bold;}
.line{background:#06c755;}
.fb{background:#1877f2;}
</style>
</head>

<body>

<div class="container">

<h1>🛒 NattDev QR Shop</h1>

<div class="nav">
<button onclick="show('home')">🏠 หน้าแรก</button>
<button onclick="show('admin')">🔧 หลังบ้าน</button>
<button onclick="show('shop')">🛍️ ร้านค้า</button>
</div>

<!-- HOME -->
<div id="home" class="page">
<div class="card">
<h2>📱 QR ร้าน</h2>
<canvas id="qr"></canvas>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="page hidden">
<div class="card">
<h2>🔧 หลังบ้าน</h2>

<input id="name" placeholder="ชื่อสินค้า">
<input id="price" placeholder="ราคา">
<input id="img" placeholder="ลิงก์รูป">
<textarea id="desc" placeholder="รายละเอียด"></textarea>

<button onclick="addProduct()">➕ เพิ่มสินค้า</button>

<div id="adminList"></div>
</div>
</div>

<!-- SHOP -->
<div id="shop" class="page hidden">

<div class="card">
<h2>📞 ติดต่อร้าน</h2>

<a href="https://line.me/ti/g2/AMkf59O56XfZQn1Tgp_ER7Jqpm-ObPGyWR15MQ?utm_source=invitation&utm_medium=link_copy&utm_campaign=default" target="_blank" class="contact-btn line">
💬 เข้ากลุ่ม LINE (NattDev)
</a>

<a href="https://www.facebook.com/share/18WYnQ5aRZ/?mibextid=wwXIfr" target="_blank" class="contact-btn fb">
📘 ติดต่อ Facebook
</a>

<p style="font-size:13px;opacity:0.8;">
📢 โอนแล้วส่งสลิปทาง LINE หรือ Facebook
</p>

</div>

<div class="card">
<h2>🛍️ สั่งซื้อ</h2>

<input id="cname" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">
<input id="contact" placeholder="Facebook / Line">

<div id="shopList"></div>

<button onclick="order()">✅ สั่งซื้อ</button>

<div id="result"></div>

</div>
</div>

</div>

<script>

// ===== เปลี่ยนหน้า =====
function show(page){
  document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
  document.getElementById(page).classList.remove("hidden");
}

// ===== โหลดสินค้า =====
let products = JSON.parse(localStorage.getItem("products")) || [];

// ===== เพิ่มสินค้า =====
function addProduct(){
  if(!name.value || !price.value){
    alert("กรอกชื่อและราคา");
    return;
  }

  let p = {
    name:name.value,
    price:price.value,
    img:img.value || "https://via.placeholder.com/300",
    desc:desc.value
  };

  products.push(p);
  localStorage.setItem("products", JSON.stringify(products));

  name.value = price.value = img.value = desc.value = "";
  render();
}

// ===== แสดงสินค้า =====
function render(){
  adminList.innerHTML="";
  shopList.innerHTML="";

  products.forEach(p=>{
    adminList.innerHTML += `
      <div class="product">
        ${p.name} - ${p.price} บาท
      </div>
    `;

    shopList.innerHTML += `
      <div class="product">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <p>${p.price} บาท</p>
        <input type="checkbox" value="${p.name}|${p.price}">
      </div>
    `;
  });
}

// ===== QR =====
QRCode.toCanvas(document.getElementById("qr"), window.location.href);

// ===== Telegram =====
const TOKEN = "PUT_YOUR_TOKEN";
const CHAT_ID = "PUT_CHAT_ID";

// ===== สั่งซื้อ =====
function order(){

  if(!cname.value || !phone.value){
    alert("กรอกชื่อและเบอร์");
    return;
  }

  let selected=[];
  let total=0;

  document.querySelectorAll("#shop input[type=checkbox]:checked")
  .forEach(el=>{
    let [n,p]=el.value.split("|");
    selected.push(n);
    total+=parseInt(p);
  });

  if(selected.length===0){
    alert("เลือกสินค้า");
    return;
  }

  let msg = `
🛒 ออเดอร์ใหม่
👤 ${cname.value}
📞 ${phone.value}
💬 ${contact.value}

📦 ${selected.join(", ")}
💰 ${total} บาท
`;

  fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      chat_id:CHAT_ID,
      text:msg
    })
  });

  result.innerHTML = `
  <p>📎 ลิงก์ร้าน</p>
  <input value="${location.href}">
  `;

  alert("สั่งซื้อสำเร็จ");
}

// ===== start =====
render();

</script>

</body>
</html>
