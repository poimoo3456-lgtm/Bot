<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NattDev Secure Shop</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body{font-family:sans-serif;background:#0f172a;color:white;padding:15px;}
.card{background:#1e293b;padding:10px;border-radius:15px;margin-top:10px;}
img{width:100%;border-radius:10px;}
input,button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:10px;}
button{background:#22c55e;color:white;}
#qr{margin-top:20px;}
</style>
</head>

<body>

<h1>🛒 NattDev Secure Shop</h1>

<input id="cname" placeholder="ชื่อ">
<input id="phone" placeholder="เบอร์">

<div id="products"></div>

<h2 id="total">รวม: 0 บาท</h2>

<button onclick="order()">📦 สั่งซื้อ + สร้าง QR</button>

<canvas id="qr"></canvas>

<script>

// ===== CONFIG =====
const SHEET_URL = "https://docs.google.com/spreadsheets/d/141QI6fMLl7VOLcfsjXJEr1hpq3MDZzIt2laoYvPelG4/export?format=csv";

const TELEGRAM_TOKEN = "8583371666:AAFgVt_SVUw8Gr5DJCzIG474MqmbJ6HBtjg";
const CHAT_ID = "7967010433";

let total = 0;
let selectedPromptPay = "";

// ===== LOAD =====
fetch(SHEET_URL)
.then(res => res.text())
.then(csv => {

  let rows = csv.split("\n").slice(1);

  rows.forEach(row=>{
    let col = row.split(",");

    let name = col[0];
    let price = parseInt(col[1]);
    let img = col[2];
    let promptpay = col[4];

    document.getElementById("products").innerHTML += `
      <div class="card">
        <img src="${img}">
        <h3>${name}</h3>
        <p>${price} บาท</p>
        <input type="checkbox" onchange="calc(this,${price},'${promptpay}')">
      </div>
    `;
  });

});

// ===== CALC =====
function calc(el,price,promptpay){
  if(el.checked){
    total += price;
    selectedPromptPay = promptpay;
  }else{
    total -= price;
  }

  document.getElementById("total").innerText = "รวม: " + total + " บาท";
}

// ===== QR PROMPTPAY =====
function generateQR(id,amount){

  let payload = "00020101021129370016A00000067701011101130066"+id+"5802TH530376454"+amount.toFixed(2)+"6304";

  QRCode.toCanvas(document.getElementById("qr"), payload);
}

// ===== ORDER =====
function order(){

  let items=[];

  document.querySelectorAll("input[type=checkbox]:checked")
  .forEach(el=>{
    let name = el.parentElement.querySelector("h3").innerText;
    items.push(name);
  });

  if(!selectedPromptPay){
    alert("ไม่มี PromptPay ร้าน");
    return;
  }

  // สร้าง QR ของร้าน
  generateQR(selectedPromptPay, total);

  let msg = `
🛒 ออเดอร์ใหม่
👤 ${cname.value}
📞 ${phone.value}

📦 ${items.join(", ")}
💰 ${total} บาท
💳 ร้าน: ${selectedPromptPay}
`;

  fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      chat_id:CHAT_ID,
      text:msg
    })
  });

  alert("ระบบสร้าง QR ของร้านแล้ว เงินเข้าร้านโดยตรง");
}

</script>

</body>
</html>
